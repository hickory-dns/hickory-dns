[package]
name = "hickory-dnstap"

description = """
DNSTAP structured binary logging for DNS servers. Encodes DNS events as
Protocol Buffer messages and transports them over Frame Streams.
"""

documentation = "https://docs.rs/hickory-dnstap"

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, default-features = false, features = [
    "std",
    "sink",
] }
prost = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true
tracing-core.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }

metrics = { workspace = true, optional = true }

[dev-dependencies]
metrics-util = { workspace = true, features = ["debugging"] }
protox = { workspace = true }
prost-build = { workspace = true }
test-support.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }

[features]
metrics = ["dep:metrics"]

[lints]
workspace = true
